<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡SORPRESA! 🐵</title>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="broma-body">
    <div class="broma-container">
        <h1 class="broma-title">Sorpresa!<span class="emoji">🎉🐵</span></h1>
        <p class="broma-subtitle">Tranquila NSLQVAPM...</p>

        <img src="mono 1.gif" alt="Mono sorpresa" class="mono-image">

        <br>
        <a href="javascript:history.back()" class="back-card-btn">
            <div class="card-left">
                <div class="icon-box back-icon">
                    <i class="bi bi-arrow-left"></i>
                </div>
                <div class="card-info">
                    <span class="card-tag">VOLVER</span>
                    <span class="card-title">Volver a los enlaces</span>
                </div>
            </div>
        </a>
    </div>

    <script>
        // Create continuous falling confetti
        function createConfetti() {
            if (document.querySelectorAll('.confetti-piece').length > 45) return;

            const colors = ['#ff6b6b', '#ffd93d', '#6bcf7f', '#4d94ff', '#e716b3', '#ff69b4', '#ffa500', '#00ff00'];

            const confetti = document.createElement('div');
            confetti.className = 'confetti-piece';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.top = '-20px';
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.width = Math.random() * 10 + 5 + 'px';
            confetti.style.height = Math.random() * 10 + 5 + 'px';

            // Random falling properties
            const duration = Math.random() * 3 + 2;
            const swayAmount = Math.random() * 100 - 50;
            const rotationSpeed = Math.random() * 360;

            confetti.style.setProperty('--duration', duration + 's');
            confetti.style.setProperty('--sway', swayAmount + 'px');
            confetti.style.setProperty('--rotation', rotationSpeed + 'deg');

            document.body.appendChild(confetti);

            setTimeout(() => confetti.remove(), duration * 1000);
        }

        // Start continuous confetti after page loads
        window.addEventListener('load', () => {
            setTimeout(() => {
                // Create initial burst
                for (let i = 0; i < 50; i++) {
                    setTimeout(createConfetti, i * 30);
                }

                // Continue creating confetti continuously - more frequently
                setInterval(createConfetti, 100);

                // Create extra bursts periodically
                setInterval(() => {
                    for (let i = 0; i < 10; i++) {
                        setTimeout(createConfetti, i * 20);
                    }
                }, 2000);
            }, 500);
        });
    </script>
</body>

</html>
